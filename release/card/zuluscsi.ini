# zuluscsi.ini - ZuluSCSI settings for the Atari System V card.
# Fill in your WiFi network (2.4 GHz; the DaynaPORT emulation needs the
# radio module) and keep the files HD0.bin (SCSI ID 0, the system) and
# NE4.img (SCSI ID 4, the network device) beside this file.
[SCSI]
WiFiSSID = "your network name"
WiFiPassword = "your network password"
