# bluescsi.ini - BlueSCSI (Pico W / Pico 2 W) settings for the Atari
# System V card.  Fill in your WiFi network (2.4 GHz) and keep the files
# HD0.bin (SCSI ID 0, the system) and NE4.img (SCSI ID 4, the network
# device) beside this file.
[SCSI]
WiFiSSID = "your network name"
WiFiPassword = "your network password"
