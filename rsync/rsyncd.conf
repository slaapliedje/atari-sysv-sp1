# /etc/rsyncd.conf - read-only whole-system backup source for the PC
# (sp1/rsync). rsync runs from inetd; only the addresses in `hosts allow',
# with the password in /etc/rsyncd.secrets, can read.
uid = root
gid = root
use chroot = no
read only = yes
list = no
reverse lookup = no
max connections = 1
log file = /var/adm/rsyncd.log
# SVR4 has no /var/run (and comments must be on lines of their own)
lock file = /var/adm/rsyncd.lock
transfer logging = no
timeout = 600

[root]
	comment = the whole system, read-only
	path = /
	hosts allow = PC_ADDRESS
	auth users = backup
	secrets file = /etc/rsyncd.secrets
	exclude = /proc/ /var/tmp/*
