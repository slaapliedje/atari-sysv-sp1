# /usr/local/etc/mtools.conf on Atari System V (sp1 amix/mtools)
#
# u: the USB stick on the kernel USB driver's storage unit 0, read by
#    block number through /dev/ub0 (whole stick, no 2 GB limit); its
#    first partition.  Needs `ubtool daemon` running (/etc/init.d/ub).
# v: the same stick through the raw device: the first 2 GB only.
drive u: file="ub:0" partition=1
drive v: file="/dev/rdsk/usb0" partition=1
mtools_skip_check=1
